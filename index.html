<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mira Maradona — Operazione Maradona (2026)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<!-- Logo: fissato al margine 0px, sempre visibile -->
<a class="logo" href="#" aria-label="Mira Maradona">
  <img src="logo_blue_01.svg" alt="Mira Maradona" />
</a>

<!-- Menu -->
<nav class="menu" aria-label="Menu principale">
  <a href="#about">/ ABOUT</a>
  <a href="#gallery">/ GALLERY</a>
  <a href="#team">/ TEAM</a>
  <a href="#mappe">/ MAPPE</a>
</nav>

<!-- PAGINA HERO (esistente): resta come backdrop fisso e si rivela con lo scroll -->
<section class="hero">
  <div class="hero__bg" role="img" aria-label="Maradona"></div>

  <h1 class="hero__title">
    <span>OPERAZIONE</span>
    <span>MARADONA</span>
    <span>(2026)</span>
  </h1>
</section>

<!-- SCROLLER: l'intro si apre per prima, poi con lo scroll si arriva all'hero -->
<main id="scroller">
  <!-- INTRO: il sito si apre con questo testo grande -->
  <section class="intro" id="intro">
    <h2 class="intro__text">
      ICONOGRAFIA DEL MITO ARGENTINO,<br />DIEGO ARMANDO MARADONA.
    </h2>
  </section>
</main>

<!-- GSAP + ScrollTrigger -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="main.js"></script>
</body>
</html>
